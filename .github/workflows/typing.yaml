name: Typing Validation

on:
 push:
   branches: [master]
   tags:
 pull_request:

jobs:
  run:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10']

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        architecture: x64

    - name: Install dependencies
      run: python -m pip install tox

    - name: Run mypy
      run: tox -e mypy
